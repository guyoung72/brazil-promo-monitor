# 브라질 이커머스 & D2C 프로모션 모니터 설정
# ⚠️ 아래 URL은 공개 URL 패턴 기준 초안입니다. 첫 실행 전 `python check_urls.py`로
#    각 페이지가 정상 열리는지 확인하고, 깨진 URL은 실제 카테고리 페이지 주소로 바꿔 주세요.

timezone: America/Sao_Paulo
model: claude-opus-5-5
effort: medium              # low | medium | high  (비용↔정확도)
use_fallbacks: true         # 모델이 요청을 거절할 때 서버 측 대체 모델로 자동 재시도

capture:
  viewport: {width: 1366, height: 900}
  max_page_height: 6000     # 스크린샷 최대 높이(px). 이 아래는 잘라냄
  tile_height: 1500         # AI에 보낼 때 자르는 단위
  max_tiles: 4
  page_timeout_ms: 45000
  delay_between_pages_s: 5  # 사이트 부하 방지용 대기

# 비교 기준 CEP(우편번호). 사이트가 CEP 입력을 요구하면 이 값을 사용합니다(상파울루 Av. Paulista).
cep: "01310-100"

categories: [tv, refrigerator, washer]

sites:
