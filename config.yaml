teams:
  # Teams 채널의 Workflows(Power Automate) 웹훅 URL은 환경변수 TEAMS_WEBHOOK_URL 로 넣습니다.
  dashboard_url: "http://사내서버주소/promo-dashboard/"   # Teams 카드의 '대시보드 열기' 버튼 링크
  price_drop_alert_pct: 5     # 전일 대비 이 % 이상 가격 하락 시 알림
